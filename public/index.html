<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>nyarr</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="logo.png" alt="" class="brand-mark" />
        <span class="brand-word" id="brandWord">ny<span class="brand-accent">arr</span></span>
      </div>
      <nav class="nav" id="nav">
        <a href="#/dashboard" data-route="dashboard"><span class="nav-icon">▣</span>Dashboard</a>
        <a href="#/tagsets" data-route="tagsets"><span class="nav-icon">⌗</span>Tag Sets</a>
        <a href="#/library" data-route="library"><span class="nav-icon">▦</span>Library</a>
        <a href="#/tags" data-route="tags"><span class="nav-icon">⌗</span>Tags</a>
        <a href="#/activity" data-route="activity"><span class="nav-icon">≋</span>Activity</a>
        <a href="#/settings" data-route="settings"><span class="nav-icon">⚙</span>Settings</a>
        <div class="nav-sub" id="navSub"></div>
      </nav>
      <div class="sidebar-footer">
        <div class="pulse-dot" id="schedulerPulse"></div>
        <span>Scheduler running</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="pageTitle">Dashboard</h1>
        <div class="topbar-actions" id="topbarActions"></div>
      </header>
      <div class="content" id="content"><!-- rendered by app.js --></div>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modal"></div>
  </div>

  <div class="toasts" id="toasts"></div>

  <!--NYARR_BOOTSTRAP-->
  <script src="app.js"></script>
</body>

</html>
